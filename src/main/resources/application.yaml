payflow:
  security:
    api-key-pepper: dev-only-pepper-change-me
    admin-token: dev-admin-token
server:
  port: 8081
spring:
  application:
    name: payflow
  datasource:
    url: jdbc:mysql://localhost:3307/payflow
    username: payflow
    password: payflow
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true